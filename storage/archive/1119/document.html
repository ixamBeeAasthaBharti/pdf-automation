a. &quot;India needs an ecosystem where talent and skills can be nurtured. Through our. `10,000 crore fund of fund for start-ups, we will provide soft loans, capital to those who want to start fresh enterprises,&quot; she said. The skill development and entrepreneurship ministry currently offers certified training in 31 different sectors under the Pradhan Mantri Kaushal Vikas Yojana. Sitharaman, in another event organised by the Confederation of Indian Industry, said India, which ranked 142 in the World Bank&#x27;s &#x27;Ease of Doing Business&#x27; index, is likely to fare better this year as the government has taken several steps to improve the standing. (The Economic Times – September 11, 2015)</title>
